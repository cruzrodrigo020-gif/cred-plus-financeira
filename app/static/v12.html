<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRED+ Financeira • Premium</title>
<link rel="stylesheet" href="/static/v12.css?v=4">
<link rel="stylesheet" href="/static/v12-collectors.css">
<link rel="stylesheet" href="/static/v12-growth.css">
<link rel="stylesheet" href="/static/v13-whatsapp.css">
<link rel="stylesheet" href="/static/chat.css?v=4">
<link rel="stylesheet" href="/static/sidebar-scroll.css?v=1">
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="login-mark">＋</div>
    <div class="brand">CRED<span>+</span></div>
    <p><b>Financeira Premium</b><br><span class="muted">Gestão de clientes, contratos, parcelas, cobradores, metas, rotas, risco e avisos de vencimento em um único painel.</span></p>
    <div class="field"><label>Usuário</label><input id="loginUser" autocomplete="username"></div>
    <div class="field"><label>Senha</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary full" onclick="doLogin()">Entrar no painel</button>
    <button type="button" class="btn btn-soft full" style="margin-top:10px" onclick="togglePasswordRecovery()">Esqueci minha senha / Redefinir senha</button>
    <form id="passwordRecoveryForm" class="hidden" style="margin-top:14px" onsubmit="submitPasswordRecovery(event)">
      <p class="muted">Para sua segurança, informe sua senha atual ou o código de recuperação configurado pelo responsável no Railway.</p>
      <div class="field"><label>Usuário</label><input name="username" autocomplete="username" required value="admin"></div>
      <div class="field"><label>Senha atual (se souber)</label><input name="current_password" type="password" autocomplete="current-password"></div>
      <div class="field"><label>Código de recuperação (se esqueceu a senha)</label><input name="recovery_code" type="password" autocomplete="off"></div>
      <div class="field"><label>Nova senha (mínimo 12 caracteres, letras e números)</label><input name="new_password" type="password" autocomplete="new-password" minlength="12" required></div>
      <div class="field"><label>Confirmar nova senha</label><input id="confirmRecoveryPassword" type="password" autocomplete="new-password" minlength="12" required></div>
      <button class="btn btn-primary full" type="submit">Redefinir senha</button>
      <p id="recoveryMsg" class="muted" role="status"></p>
    </form>
    <div id="loginMsg" class="muted" style="margin-top:10px"></div>
  </div>
</div>
<div id="app" class="hidden">
  <aside class="sidebar"><div class="side-brand"><div class="brand">CRED<span>+</span></div><div class="side-sub">FINANCEIRA • PREMIUM</div></div><div id="nav" class="nav"></div></aside>
  <main class="main">
    <div class="topbar"><div><h1 id="title">Dashboard</h1><div id="meta" class="top-meta"></div></div><div class="actions"><button class="glass" onclick="go(PAGE)">Atualizar</button><button class="glass" onclick="logout()">Sair</button></div></div>
    <div id="content"></div>
  </main>
</div>
<div id="modal" class="modal hidden"><div id="modalBox" class="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>

</body></html>
