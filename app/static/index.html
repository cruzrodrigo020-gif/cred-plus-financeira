<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRED+ Financeira</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#17202a}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0d1b36,#1357d8)}.box,.card,.section{background:#fff;border-radius:16px;border:1px solid #e4e7ec}.box{padding:30px;width:min(420px,92%);box-shadow:0 20px 60px #0004}.logo{font-size:32px;font-weight:900}.logo span{color:#1357d8}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin:6px 0 12px}.btn{padding:10px 14px;border:0;border-radius:9px;background:#e9edf2;font-weight:700;cursor:pointer}.primary{background:#1357d8;color:white}.app{display:none}.side{position:fixed;inset:0 auto 0 0;width:220px;background:#101828;color:#fff;padding:18px}.side button{display:block;width:100%;text-align:left;background:transparent;color:#ddd;border:0;padding:11px;border-radius:8px;cursor:pointer}.main{margin-left:220px;padding:25px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.section{padding:17px;margin-top:14px}.value{font-size:24px;font-weight:900;margin-top:6px}.muted{color:#667085;font-size:13px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:900px){.side{width:64px}.side span{display:none}.main{margin-left:64px}.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div id="login" class="login"><div class="box"><div class="logo">CRED<span>+</span></div><p><b>Financeira</b><br><span class="muted">Gestão de clientes, contratos e cobranças</span></p><label>Usuário</label><input id="user" autocomplete="username"><label>Senha</label><input id="pass" type="password" autocomplete="current-password"><button class="btn primary" style="width:100%" onclick="doLogin()">Entrar</button><p id="msg" class="muted"></p></div></div><div id="app" class="app"><aside class="side"><div class="logo">C<span>+</span></div><hr><button onclick="page('dashboard')">📊 <span>Dashboard</span></button><button onclick="page('clients')">👥 <span>Clientes</span></button><button onclick="page('contracts')">📄 <span>Contratos</span></button><button onclick="page('installments')">📅 <span>Parcelas</span></button><button onclick="page('users')">🧑‍💼 <span>Usuários</span></button><button onclick="page('cash')">💰 <span>Caixa</span></button><button onclick="logout()">🚪 <span>Sair</span></button></aside><main class="main"><h1 id="title">Dashboard</h1><div id="who" class="muted"></div><div id="content"></div></main></div><script>let T=localStorage.getItem('cp_token'),U=null;const $=i=>document.getElementById(i),money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+T};const r=await fetch(url,opt);if(!r.ok)throw new Error((await r.json()).detail||'Erro');return r.json()}async function doLogin(){const f=new FormData();f.append('username',$('user').value);f.append('password',$('pass').value);const r=await fetch('/api/login',{method:'POST',body:f});if(!r.ok){$('msg').textContent='Usuário ou senha inválidos';return}const x=await r.json();T=x.token;U=x.user;localStorage.setItem('cp_token',T);show();page('dashboard')}function show(){$('login').style.display='none';$('app').style.display='block';$('who').textContent=U?U.name+' • '+U.role:''}function logout(){localStorage.removeItem('cp_token');location.reload()}async function page(p){$('title').textContent={dashboard:'Dashboard',clients:'Clientes',contracts:'Contratos',installments:'Parcelas',users:'Usuários',cash:'Caixa'}[p]||p;try{if(p==='dashboard')return dashboard();if(p==='clients')return clients();if(p==='contracts')return contracts();if(p==='installments')return installments();if(p==='users')return users();if(p==='cash')return cash()}catch(e){alert(e.message)}}async function dashboard(){const x=await api('/api/dashboard');$('content').innerHTML=`<div class="grid"><div class="card">Caixa<div class="value">${money(x.cash)}</div></div><div class="card">Clientes<div class="value">${x.clients}</div></div><div class="card">Contratos<div class="value">${x.contracts}</div></div><div class="card">A receber<div class="value">${money(x.receivable)}</div></div><div class="card">Em atraso<div class="value">${money(x.overdue)}</div></div></div><div class="section"><h3>Recebido hoje</h3><b>${money(x.received_today)}</b></div>`}async function clients(){const a=await api('/api/clients');$('content').innerHTML=`<div class="section"><button class="btn primary" onclick="newClient()">+ Cliente</button><div class="table"><table><tr><th>ID</th><th>Nome</th><th>CPF</th><th>WhatsApp</th><th>Renda</th></tr>${a.map(x=>`<tr><td>${x.id}</td><td>${x.name}</td><td>${x.cpf}</td><td>${x.whatsapp}</td><td>${money(x.income)}</td></tr>`).join('')}</table></div></div>`}function newClient(){const n=prompt('Nome completo:');if(!n)return;const f=new FormData();f.append('name',n);f.append('cpf',prompt('CPF:')||'');f.append('whatsapp',prompt('WhatsApp:')||'');f.append('income',prompt('Renda:','0')||'0');api('/api/clients',{method:'POST',body:f}).then(clients).catch(e=>alert(e.message))}async function contracts(){const a=await api('/api/contracts');$('content').innerHTML=`<div class="section"><button class="btn primary" onclick="newContract()">+ Contrato</button><div class="table"><table><tr><th>Nº</th><th>Cliente</th><th>Principal</th><th>Total</th><th>Parcelas</th><th>Status</th></tr>${a.map(x=>`<tr><td>${x.number}</td><td>${x.client}</td><td>${money(x.principal)}</td><td>${money(x.total)}</td><td>${x.installments}</td><td>${x.status}</td></tr>`).join('')}</table></div></div>`}async function newContract(){const cs=await api('/api/clients'),ps=await api('/api/products');if(!cs.length)return alert('Cadastre um cliente primeiro');const cid=prompt('ID do cliente:\n'+cs.map(x=>x.id+' - '+x.name).join('\n')),pid=prompt('ID do produto:\n'+ps.map(x=>x.id+' - '+x.name+' ('+x.rate+'%)').join('\n')),a=prompt('Valor do crédito:'),n=prompt('Número de parcelas:','20'),d=prompt('Primeiro vencimento (AAAA-MM-DD):');if(!cid||!pid||!a||!n||!d)return;const f=new FormData();f.append('client_id',cid);f.append('product_id',pid);f.append('principal',a);f.append('installments',n);f.append('first_due',d);api('/api/contracts',{method:'POST',body:f}).then(contracts).catch(e=>alert(e.message))}async function installments(){const a=await api('/api/installments');$('content').innerHTML=`<div class="section"><div class="table"><table><tr><th>Cliente</th><th>Contrato</th><th>#</th><th>Vencimento</th><th>Valor</th><th>Pago</th><th>Status</th><th></th></tr>${a.map(x=>`<tr><td>${x.client}</td><td>${x.contract}</td><td>${x.number}</td><td>${x.due_date}</td><td>${money(x.amount)}</td><td>${money(x.paid_amount)}</td><td>${x.status}</td><td>${x.status!=='paid'?`<button class="btn" onclick="pay(${x.id},${x.amount-x.paid_amount})">Pagar</button>`:''}</td></tr>`).join('')}</table></div></div>`}function pay(id,remaining){const v=prompt('Valor recebido:',remaining.toFixed(2));if(!v)return;const f=new FormData();f.append('installment_id',id);f.append('amount',v);f.append('payment_date',new Date().toISOString().slice(0,10));f.append('method','PIX');api('/api/payments',{method:'POST',body:f}).then(installments).catch(e=>alert(e.message))}async function users(){const a=await api('/api/users');$('content').innerHTML=`<div class="section"><button class="btn primary" onclick="newUser()">+ Usuário</button><div class="table"><table><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Ativo</th></tr>${a.map(x=>`<tr><td>${x.name}</td><td>${x.username}</td><td>${x.role}</td><td>${x.active?'Sim':'Não'}</td></tr>`).join('')}</table></div></div>`}function newUser(){const n=prompt('Nome:'),u=prompt('Usuário:'),p=prompt('Senha (mín. 8 caracteres):'),r=prompt('Perfil (admin/collector):','collector');if(!n||!u||!p)return;const f=new FormData();f.append('name',n);f.append('username',u);f.append('password',p);f.append('role',r);api('/api/users',{method:'POST',body:f}).then(users).catch(e=>alert(e.message))}async function cash(){const x=await api('/api/dashboard');$('content').innerHTML=`<div class="section"><h2>Caixa atual: ${money(x.cash)}</h2><button class="btn primary" onclick="expense()">+ Despesa</button></div>`}function expense(){const a=prompt('Valor da despesa:'),d=prompt('Descrição:');if(!a)return;const f=new FormData();f.append('amount',a);f.append('movement_date',new Date().toISOString().slice(0,10));f.append('description',d||'');api('/api/cash/expense',{method:'POST',body:f}).then(cash).catch(e=>alert(e.message))}if(T){api('/api/me').then(x=>{U=x;show();page('dashboard')}).catch(()=>localStorage.removeItem('cp_token'))}</script></body></html>
