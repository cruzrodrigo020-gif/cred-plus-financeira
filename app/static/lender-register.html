<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cadastro do Emprestador • CRED+ Financeira</title><link rel="stylesheet" href="/static/lender.css"></head><body><main class="wrap"><section class="auth"><div class="brand"><div class="logo">C+</div><div><h1>CRED+ Financeira</h1><p>Cadastro do emprestador</p></div></div><form id="form" class="card"><div class="grid"><label class="wide"><span>Nome completo *</span><input name="name" required autocomplete="name"></label><label><span>CPF *</span><input name="cpf" required inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></label><label><span>RG</span><input name="rg" maxlength="30"></label><label><span>Data de nascimento</span><input name="birth_date" type="date"></label><label><span>WhatsApp *</span><input name="whatsapp" required inputmode="tel" placeholder="(91) 99999-9999"></label><label class="wide"><span>E-mail de acesso *</span><input name="email" type="email" required autocomplete="email"></label><label><span>Profissão</span><input name="profession"></label><label><span>Cidade</span><input name="city"></label><label><span>Estado</span><input name="state" maxlength="2" placeholder="PA"></label><label class="wide"><span>Endereço</span><input name="address"></label><label><span>Crie uma senha *</span><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password"></label><label><span>Confirme a senha *</span><input id="confirm" type="password" minlength="8" required autocomplete="new-password"></label></div><label class="consent"><input type="checkbox" name="consent" value="sim" required><span class="small">Confirmo que os dados são meus e autorizo o cadastro da minha conta na CRED+ Financeira. O acesso ao sistema é uma ferramenta de gestão e não representa autorização regulatória para concessão de crédito.</span></label><button id="submit" class="btn primary full" type="submit">Criar minha conta</button><div id="msg" class="message"></div></form><div class="link">Já tem conta? <a href="/emprestador">Entrar no aplicativo</a></div></section></main><script src="/static/lender-register.js"></script></body></html>
